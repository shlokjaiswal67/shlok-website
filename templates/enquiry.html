
<!DOCTYPE html>
<html>
<head>
<title>Enquiry - Shlok Website</title>
<style>
body {margin:0;font-family:Arial;background:#f1f5f9;}
nav {background:#172554;padding:24px 10px;text-align:center;}
nav a {color:white;text-decoration:none;font-size:23px;font-weight:bold;margin:12px;display:inline-block;}
nav a:hover {color:#facc15;}
h1 {text-align:center;color:#172554;font-size:40px;margin-top:35px;}
.formbox {background:white;max-width:600px;margin:30px auto;padding:35px;border-radius:15px;box-shadow:0 4px 15px #0002;}
input,textarea {width:100%;padding:15px;margin:12px 0;border:1px solid #aaa;border-radius:7px;font-size:17px;}
button {width:100%;padding:16px;background:#172554;color:white;border:0;border-radius:7px;font-size:20px;font-weight:bold;cursor:pointer;}
button:hover {background:#2563eb;}
.success {background:#dcfce7;color:#166534;padding:15px;border-radius:8px;text-align:center;}
@media(max-width:600px) {nav a {font-size:16px;margin:7px;}}
</style>
</head>
<body>

<nav>
<a href="/">HOME</a>
<a href="/enquiry">ENQUIRY</a>
<a href="/gallery">GALLERY</a>
<a href="/services">SERVICES</a>
<a href="/contact">CONTACT</a>
</nav>

<h1>ENQUIRY FORM</h1>

<div class="formbox">

{% if submitted %}
<div class="success">
<h2>Thank You!</h2>
<p>Your enquiry has been submitted successfully.</p>
</div>
{% else %}

<form method="POST">
<input type="text" name="name" placeholder="Enter Your Name" required>

<input type="tel" name="phone" placeholder="Enter Mobile Number"
pattern="[0-9]{10}" maxlength="10" required>

<textarea name="message" rows="5"
placeholder="Write Your Enquiry Here..." required></textarea>

<button type="submit">SUBMIT ENQUIRY</button>
</form>

{% endif %}

</div>
</body>
</html>
