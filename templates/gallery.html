<!DOCTYPE html>
<html>
<head>
    <title>Gallery - Shlok Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f1f5f9;
        }

        nav {
            background: #172554;
            padding: 24px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin: 12px;
        }

        h1 {
            text-align: center;
            color: #172554;
            margin: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 3px 10px #999;
        }

        @media(max-width:600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/services">Services</a>
    <a href="/gallery">Gallery</a>
    <a href="/contact">Contact</a>
</nav>

<h1>Our Photo Gallery</h1>

<div class="gallery">

    <img src="{{ url_for('static', filename='event.jpg') }}">
    <img src="{{ url_for('static', filename='photo1.jpg') }}">
    <img src="{{ url_for('static', filename='profile.jpg') }}">
    <img src="{{ url_for('static', filename='profile2.jpg') }}">

</div>

</body>
</html>
