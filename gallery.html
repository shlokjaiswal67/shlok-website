<!DOCTYPE html>
<html>
<head>
<title>My Photo Gallery</title>
<style>
body {
margin:0;
font-family:Arial;
background:#f0f4f8;
}
nav {
background:#172554;
padding:25px;
text-align:center;
}
nav a {
color:white;
text-decoration:none;
font-size:25px;
font-weight:bold;
margin:12px;
}
h1 {
text-align:center;
font-size:40px;
color:#172554;
}
.gallery {
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding:30px;
}
.gallery img {
width:100%;
height:250px;
object-fit:cover;
border-radius:12px;
}
@media(max-width:700px) {
.gallery { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>



<h1>MY PHOTO GALLERY</h1>

<div class="gallery">
<img src="/static/photo1.jpg">
<img src="/static/photo2.jpg">
<img src="/static/photo3.jpg">
<img src="/static/photo4.jpg">
<img src="/static/photo5.jpg">
<img src="/static/photo6.jpg">
</div>

</body>
</html>
